<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CATN - Decryption Interface</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #00ff41;
            font-family: 'VT323', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.7);
        }

        #scanner-container {
            position: relative;
            display: flex;
            align-items: center;
            padding: 20px;
        }

        /* La barra horizontal con menor opacidad */
        #focus-bar {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 100px;
            background: rgba(0, 255, 65, 0.1);
            border-top: 1px solid rgba(0, 255, 65, 0.3);
            border-bottom: 1px solid rgba(0, 255, 65, 0.3);
            transform: translateY(-50%);
            z-index: 1;
            pointer-events: none;
        }

        .column {
            font-size: 8rem;
            width: 80px;
            text-align: center;
            height: 8rem;
            overflow: hidden;
            z-index: 2;
        }

        .letter-strip {
            display: flex;
            flex-direction: column;
            transition: transform 0.1s linear;
        }

        #cursor {
            font-size: 8rem;
            background-color: #00ff41;
            width: 45px;
            height: 85px;
            margin-left: 20px;
            opacity: 0;
            z-index: 2;
        }

        .blink { animation: blink-anim 1s step-end infinite; }
        @keyframes blink-anim { from, to { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="scanner-container">
        <div id="focus-bar"></div>
        <div class="column"><div id="col-0" class="letter-strip"></div></div>
        <div class="column"><div id="col-1" class="letter-strip"></div></div>
        <div class="column"><div id="col-2" class="letter-strip"></div></div>
        <div class="column"><div id="col-3" class="letter-strip"></div></div>
        <div id="cursor">_</div>
    </div>

    <script>
        const target = "CATN";
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*".split("");
        const strips = [
            document.getElementById("col-0"),
            document.getElementById("col-1"),
            document.getElementById("col-2"),
            document.getElementById("col-3")
        ];

        // Llenamos las columnas con letras aleatorias
        strips.forEach((strip, i) => {
            let content = "";
            for(let j=0; j<30; j++) {
                content += `<div>${chars[Math.floor(Math.random() * chars.length)]}</div>`;
            }
            content += `<div id="final-${i}">${target[i]}</div>`; // La letra final
            strip.innerHTML = content;
        });

        // Animación de caída
        strips.forEach((strip, i) => {
            const duration = 2000 + (i * 800); // Cada columna tarda más en frenar
            const rowHeight = strip.children[0].offsetHeight;
            const finalPos = -(strip.children.length - 1) * rowHeight;

            setTimeout(() => {
                strip.style.transition = `transform ${duration}ms cubic-bezier(0.1, 0, 0.1, 1)`;
                strip.style.transform = `translateY(${finalPos}px)`;
            }, 100);

            // Mostrar cursor al final de la última letra
            if(i === 3) {
                setTimeout(() => {
                    document.getElementById("cursor").classList.add("blink");
                }, duration + 500);
            }
        });
    </script>
</body>
</html>
