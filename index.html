<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CATN - Terminal Interface</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body, html {
            background-color: #000;
            color: #00ff41;
            font-family: 'VT323', monospace;
            margin: 0; padding: 0;
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        /* Scanlines Provisionales */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            z-index: 10;
            background-size: 100% 4px;
            pointer-events: none;
        }

        #focus-bar {
            position: absolute;
            top: 50%; left: 0;
            width: 100%; height: 160px;
            background: rgba(0, 255, 65, 0.05);
            border-top: 2px solid rgba(0, 255, 65, 0.3);
            border-bottom: 2px solid rgba(0, 255, 65, 0.3);
            transform: translateY(-50%);
            z-index: 1;
        }

        #scanner-container {
            display: flex; align-items: center;
            z-index: 2; height: 100vh;
        }

        .column {
            width: 100px;
            text-align: center;
            height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .letter-strip {
            display: flex; flex-direction: column;
            font-size: 9rem;
            /* CAMBIO CLAVE: Transición por pasos, no fluida */
            transition: transform 0.1s steps(1); 
        }

        .letter-strip div {
            height: 160px;
            display: flex; justify-content: center; align-items: center;
            flex-shrink: 0;
        }

        #cursor {
            font-size: 9rem;
            background-color: #00ff41;
            width: 50px; height: 110px;
            margin-left: 20px;
            display: none;
        }

        .blink { animation: blink-anim 1s step-end infinite; }
        @keyframes blink-anim { from, to { opacity: 1; } 50% { opacity: 0; } }

        #vignette {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, black 120%);
            z-index: 5; pointer-events: none;
        }

        /* Mensaje inicial */
        #boot-msg {
            position: absolute;
            bottom: 20px;
            font-size: 1.5rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div id="vignette"></div>
    <div id="focus-bar"></div>
    <div id="boot-msg">Haga clic para iniciar secuencia de acceso...</div>

    <div id="scanner-container">
        <div class="column"><div id="col-0" class="letter-strip"></div></div>
        <div class="column"><div id="col-1" class="letter-strip"></div></div>
        <div class="column"><div id="col-2" class="letter-strip"></div></div>
        <div class="column"><div id="col-3" class="letter-strip"></div></div>
        <div id="cursor">_</div>
    </div>

    <script>
        const target = "CATN";
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789".split("");
        const strips = [
            document.getElementById("col-0"),
            document.getElementById("col-1"),
            document.getElementById("col-2"),
            document.getElementById("col-3")
        ];

        const rowHeight = 160;
        const targetIndex = 5; 
        const totalRows = 50;

        // Audio Context
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq, dur, vol = 0.05) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + dur);
        }

        // Construir tiras
        strips.forEach((strip, i) => {
            let content = "";
            for (let j = 0; j < totalRows; j++) {
                content += `<div>${j === targetIndex ? target[i] : chars[Math.floor(Math.random() * chars.length)]}</div>`;
            }
            strip.innerHTML = content;
            // Empezar en una posición aleatoria abajo
            strip.style.transform = `translateY(-${(totalRows - 10) * rowHeight}px)`;
        });

        document.body.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            document.getElementById('boot-msg').style.display = 'none';
            
            strips.forEach((strip, i) => {
                let currentPos = (totalRows - 10);
                const speed = 60 + (i * 20); // Cada columna tiene su propio ritmo

                const moveInterval = setInterval(() => {
                    if (currentPos > targetIndex) {
                        currentPos--;
                        strip.style.transform = `translateY(-${currentPos * rowHeight}px)`;
                        // Sonido sutil de procesamiento por cada "salto"
                        if (Math.random() > 0.7) playBeep(100, 0.05, 0.02);
                    } else {
                        clearInterval(moveInterval);
                        playBeep(200, 0.2, 0.1); // Sonido de anclaje
                        if (i === 3) showCursor();
                    }
                }, speed);
            });
        });

        function showCursor() {
            const cursor = document.getElementById("cursor");
            cursor.style.display = "block";
            cursor.classList.add("blink");
            playBeep(400, 0.3, 0.1);
        }
    </script>
</body>
</html>
