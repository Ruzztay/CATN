<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CATN - Neuralypsis Interface</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body, html {
            background-color: #000;
            color: #00ff41;
            font-family: 'VT323', monospace;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #focus-bar {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 160px;
            background: rgba(0, 255, 65, 0.05);
            border-top: 2px solid rgba(0, 255, 65, 0.2);
            border-bottom: 2px solid rgba(0, 255, 65, 0.2);
            transform: translateY(-50%);
            z-index: 1;
        }

        #scanner-container {
            display: flex;
            align-items: center;
            z-index: 2;
            height: 100vh;
        }

        .column {
            width: 100px;
            text-align: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Esto asegura que el inicio sea céntrico */
            overflow: hidden;
        }

        .letter-strip {
            display: flex;
            flex-direction: column;
            font-size: 9rem;
            will-change: transform;
        }

        .letter-strip div {
            height: 160px; 
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        #cursor {
            font-size: 9rem;
            background-color: #00ff41;
            width: 50px;
            height: 110px;
            margin-left: 20px;
            opacity: 0;
        }

        .blink { animation: blink-anim 1s step-end infinite; }
        @keyframes blink-anim { from, to { opacity: 1; } 50% { opacity: 0; } }

        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, 
                black 0%, 
                transparent 30%, 
                transparent 70%, 
                black 100%);
            z-index: 3;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="vignette"></div>
    <div id="focus-bar"></div>

    <div id="scanner-container">
        <div class="column"><div id="col-0" class="letter-strip"></div></div>
        <div class="column"><div id="col-1" class="letter-strip"></div></div>
        <div class="column"><div id="col-2" class="letter-strip"></div></div>
        <div class="column"><div id="col-3" class="letter-strip"></div></div>
        <div id="cursor">_</div>
    </div>

    <script>
        const target = "CATN";
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789XY#$".split("");
        const strips = [
            document.getElementById("col-0"),
            document.getElementById("col-1"),
            document.getElementById("col-2"),
            document.getElementById("col-3")
        ];

        strips.forEach((strip, i) => {
            let content = "";
            // 1. Letras iniciales (relleno arriba)
            for(let j=0; j<10; j++) content += `<div>${chars[Math.floor(Math.random() * chars.length)]}</div>`;
            
            // 2. LA LETRA OBJETIVO (Esta es la que debe quedar al centro)
            content += `<div class="target-letter">${target[i]}</div>`;
            
            // 3. Muchas letras abajo para que parezca que vienen de lejos
            for(let j=0; j<60; j++) content += `<div>${chars[Math.floor(Math.random() * chars.length)]}</div>`;
            
            strip.innerHTML = content;

            // Posición inicial: empezamos mostrando las letras de abajo
            const rowHeight = 160;
            const startPos = -((strip.children.length - 1) * rowHeight);
            strip.style.transform = `translateY(${startPos}px)`;
        });

        window.onload = () => {
            strips.forEach((strip, i) => {
                const duration = 3000 + (i * 1000);
                const rowHeight = 160;
                
                // Calculamos la posición exacta de la letra con clase "target-letter"
                // Para que quede al centro, la movemos a -(índice * altura)
                // Como hay 10 letras antes de la ganadora, su índice es 10.
                const finalPos = -(10 * rowHeight);

                setTimeout(() => {
                    strip.style.transition = `transform ${duration}ms cubic-bezier(0.1, 0, 0.1, 1)`;
                    strip.style.transform = `translateY(${finalPos}px)`;
                }, 500);

                if(i === 3) {
                    setTimeout(() => {
                        document.getElementById("cursor").classList.add("blink");
                    }, duration + 800);
                }
            });
        };
    </script>
</body>
</html>
