<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CATN - Central Archive</title>
    <!-- Importamos la fuente estilo retro de Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #00ff41; /* Verde Matrix clásico */
            font-family: 'VT323', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            /* Efecto de resplandor sutil */
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.7), 0 0 20px rgba(0, 255, 65, 0.4);
        }
        #container {
            display: flex;
            align-items: center;
        }
        #catn-text {
            font-size: 8rem; /* Letras más grandes para lucir la fuente */
            font-weight: normal;
            letter-spacing: 10px;
        }
        #cursor {
            font-size: 8rem;
            background-color: #00ff41;
            color: #00ff41;
            width: 50px;
            height: 90px;
            margin-left: 15px;
            display: none;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            from, to { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="catn-text">****</div>
        <div id="cursor">_</div>
    </div>

    <script>
        const target = "CATN";
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*";
        const display = document.getElementById("catn-text");
        const cursor = document.getElementById("cursor");
        
        let iterations = 0;
        
        // Aumentamos el intervalo a 120ms para que sea más lento
        const interval = setInterval(() => {
            display.innerText = target.split("")
                .map((letter, index) => {
                    // Cambiamos el multiplicador a 12 para que cada letra 
                    // tarde más tiempo en detenerse
                    if(iterations > index * 12) {
                        return target[index];
                    }
                    return chars[Math.floor(Math.random() * chars.length)];
                })
                .join("");
            
            if(iterations >= target.length * 12) {
                clearInterval(interval);
                cursor.style.display = "inline-block";
            }
            
            iterations += 1;
        }, 120); // Velocidad global del cambio
    </script>
</body>
</html>
