<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CATN :: NSP TERMINAL</title>

<style>

*, *::before, *::after{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html, body{
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#000;
  font-family:'Courier New', monospace;

  animation:crtFlicker 0.08s infinite;
}

/* CRT scanlines */
body::before{
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:100;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 2px,
      rgba(0,0,0,0.18) 4px
    );

  opacity:0.55;
  mix-blend-mode:screen;
}

/* vignette */
body::after{
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:99;

  background:
    radial-gradient(
      ellipse at center,
      transparent 42%,
      rgba(0,0,0,0.94) 100%
    );
}

/* animated noise */
#noise{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:101;

  opacity:0.035;

  background-image:
    radial-gradient(circle, rgba(255,255,255,0.12) 1px, transparent 1px);

  background-size:3px 3px;

  animation:noiseShift 0.18s infinite;
}

@keyframes noiseShift{
  0%{ transform:translate(0,0); }
  25%{ transform:translate(-1%,1%); }
  50%{ transform:translate(1%,-1%); }
  75%{ transform:translate(0.5%,1%); }
  100%{ transform:translate(0,0); }
}

@keyframes crtFlicker{
  0%{ opacity:0.985; }
  50%{ opacity:1; }
  100%{ opacity:0.992; }
}

@keyframes blink{
  0%,100%{ opacity:1; }
  50%{ opacity:0; }
}

#scaler{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

#viewport{
  position:relative;
  overflow:hidden;
  flex:0 0 auto;
}

#canvas{
  position:absolute;
  left:0;
  top:0;
  width:2560px;
  height:1440px;
  overflow:hidden;

  transform-origin:left top;
}

#canvas::before{
  content:'';
  position:absolute;
  inset:-4%;
  pointer-events:none;
  z-index:460;

  opacity:0.22;

  background:
    linear-gradient(
      90deg,
      rgba(255,0,64,0.05),
      transparent 22%,
      transparent 78%,
      rgba(0,128,255,0.05)
    ),
    repeating-linear-gradient(
      0deg,
      rgba(0,255,65,0.045) 0px,
      transparent 1px,
      transparent 6px
    );

  mix-blend-mode:screen;
  animation:crtDrift 5.5s infinite linear;
}

#canvas::after{
  content:'';
  position:absolute;
  left:0;
  top:-20%;
  width:100%;
  height:18%;
  pointer-events:none;
  z-index:461;

  opacity:0.16;

  background:
    linear-gradient(
      180deg,
      transparent,
      rgba(0,255,65,0.18),
      transparent
    );

  animation:verticalHold 7s infinite ease-in-out;
}

#canvas.alert{
  animation:canvasAlert 0.45s steps(2,end);
}

#canvas.deep-listen{
  filter:contrast(1.18) saturate(1.2);
}

#atmosphere{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:8;

  opacity:0.18;

  background:
    radial-gradient(
      circle at 50% 42%,
      rgba(0,255,65,0.11),
      transparent 26%
    ),
    linear-gradient(
      90deg,
      rgba(0,72,255,0.08),
      transparent 24%,
      transparent 76%,
      rgba(255,0,96,0.06)
    );

  mix-blend-mode:screen;
  transition:opacity 0.6s, filter 0.6s;
}

#atmosphere.bloom{
  opacity:0.35;
  filter:brightness(1.6);
}

#atmosphere.warning{
  opacity:0.42;
  background:
    radial-gradient(
      circle at 50% 42%,
      rgba(255,20,82,0.16),
      transparent 30%
    ),
    linear-gradient(
      90deg,
      rgba(0,255,65,0.08),
      transparent 50%,
      rgba(255,20,82,0.12)
    );
}

#burst{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:450;

  opacity:0;

  background:
    repeating-linear-gradient(
      90deg,
      transparent 0px,
      transparent 32px,
      rgba(0,255,65,0.18) 34px,
      transparent 38px
    );
}

#burst.active{
  animation:burstPulse 0.34s steps(2,end);
}

#scan-band{
  position:absolute;
  left:0;
  top:-180px;
  width:100%;
  height:180px;
  pointer-events:none;
  z-index:430;

  opacity:0;

  background:
    linear-gradient(
      180deg,
      transparent,
      rgba(0,255,65,0.18),
      transparent
    );
}

#scan-band.active{
  animation:scanSweep 1.25s ease-in-out;
}

#stage{
  position:absolute;
  display:grid;
}

.cell{
  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:700;
  user-select:none;
}

.c-dim{
  color:rgba(0,255,65,0.10);
}

.c-near{
  color:rgba(0,255,65,0.28);
}

.c-mid{
  color:rgba(0,255,65,0.62);
}

.c-hot{
  color:#00ff41;
  text-shadow:
    0 0 8px rgba(0,255,65,0.6);

  animation:flick 0.12s infinite alternate;
}

.c-target{
  color:#00ff41;

  text-shadow:
    0 0 25px #00ff41,
    0 0 6px #fff;

  animation:flick 0.08s infinite alternate;
}

@keyframes flick{
  from{ opacity:0.92; }
  to{ opacity:1; }
}

@keyframes burstPulse{
  0%{ opacity:0; transform:translateX(0); }
  25%{ opacity:0.55; transform:translateX(-18px); }
  50%{ opacity:0.12; transform:translateX(14px); }
  75%{ opacity:0.42; transform:translateX(-8px); }
  100%{ opacity:0; transform:translateX(0); }
}

@keyframes scanSweep{
  0%{ opacity:0; transform:translateY(0); }
  15%{ opacity:0.85; }
  85%{ opacity:0.65; }
  100%{ opacity:0; transform:translateY(1620px); }
}

@keyframes canvasAlert{
  0%{ transform:scale(var(--scale,1)) translate(0,0); }
  25%{ transform:scale(var(--scale,1)) translate(8px,-4px); }
  50%{ transform:scale(var(--scale,1)) translate(-10px,3px); }
  75%{ transform:scale(var(--scale,1)) translate(6px,4px); }
  100%{ transform:scale(var(--scale,1)) translate(0,0); }
}

@keyframes crtDrift{
  from{ transform:translateY(0); }
  to{ transform:translateY(18px); }
}

@keyframes verticalHold{
  0%,78%{ transform:translateY(-180px); opacity:0; }
  82%{ opacity:0.18; }
  100%{ transform:translateY(1780px); opacity:0; }
}

#focus-bar{
  position:absolute;
  left:0;
  width:100%;

  background:rgba(0,255,65,0.05);

  border-top:1px solid rgba(0,255,65,0.35);
  border-bottom:1px solid rgba(0,255,65,0.35);

  z-index:2;
}

#boot-msg{
  position:absolute;
  left:140px;
  right:140px;
  bottom:70px;

  text-align:left;
  white-space:pre-line;

  color:rgba(0,255,65,0.65);

  font-size:24px;
  line-height:1.45;
  letter-spacing:0.12em;

  animation:blink 1.3s step-end infinite;

  z-index:200;
}

#boot-msg.booting{
  animation:none;
  color:rgba(0,255,65,0.76);
}

#prompt-line{
  position:absolute;

  display:none;
  align-items:center;

  white-space:nowrap;

  z-index:200;

  font-size:78px;
}

#prompt-prefix{
  color:#00ff41;

  margin-right:0.4em;

  text-shadow:
    0 0 12px rgba(0,255,65,0.5);
}

#prompt-text{
  color:rgba(0,255,65,0.85);

  letter-spacing:0.05em;

  white-space:nowrap;
}

#prompt-cursor{
  display:inline-block;

  width:0.55em;
  height:0.82em;

  margin-left:4px;

  background:#00ff41;

  animation:blink 1s step-end infinite;
}

#prompt-input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}

#cmd-output{
  position:absolute;

  display:none;

  width:1760px;
  max-height:1040px;
  overflow:hidden;

  white-space:pre;

  color:rgba(0,255,65,0.78);

  font-size:36px;
  line-height:1.25;
  letter-spacing:0.04em;

  z-index:200;
}

#ghost-log{
  position:absolute;

  top:80px;
  right:120px;

  font-size:30px;

  color:#00ff41;

  opacity:0;

  z-index:500;

  transition:opacity 0.4s;
}

#telemetry{
  position:absolute;

  right:90px;
  bottom:72px;

  color:rgba(0,255,65,0.38);

  font-size:22px;
  line-height:1.65;
  letter-spacing:0.12em;
  text-align:right;

  z-index:180;
}

</style>
</head>

<body>

<div id="noise"></div>

<div id="scaler">

  <div id="viewport">

    <div id="canvas">

      <div id="atmosphere"></div>

      <div id="burst"></div>

      <div id="scan-band"></div>

      <div id="focus-bar"></div>

      <div id="stage"></div>

      <div id="boot-msg">
        [ CLICK PARA INICIAR SECUENCIA ]
      </div>

      <div id="prompt-line">
        <span id="prompt-prefix">
          NSP_CHILE://FIELD&gt;
        </span>

        <span id="prompt-text"></span>

        <span id="prompt-cursor"></span>
      </div>

      <input
        id="prompt-input"
        type="text"
        autocomplete="off"
        spellcheck="false"
      />

      <div id="cmd-output"></div>

      <div id="ghost-log"></div>

      <div id="telemetry">
        SIG: -- / TEMP: COLD / WATCH: PASSIVE
      </div>

    </div>

  </div>

</div>

<script>

(function(){

/* ========================================================= */
/* CONFIG */
/* ========================================================= */

const CW=2560;
const CH=1440;

const DEFAULT_SCALE_CALIBRATION=1;
const SCALE_STORAGE_KEY='catn_layout_scale_v2';

const CELL=160;
const FS=100;

const COLS=4;
const ROWS=18;

const TARGET=['C','A','T','N'];

const CHARS=
'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&!?'.split('');

const CR=4;

const GW=COLS*CELL;

const SL0=(CW-GW)/2;
const ST0=0;
const FT0=CR*CELL;

let scaleCalibration=parseFloat(
  localStorage.getItem(SCALE_STORAGE_KEY)
);

if(!Number.isFinite(scaleCalibration)){
  scaleCalibration=DEFAULT_SCALE_CALIBRATION;
}

/* ========================================================= */
/* LOCAL SESSION                                             */
/* ========================================================= */

const SESSION_STORAGE_KEY='catn_agent_session_v1';

function randomHex(len){
  const chars='0123456789ABCDEF';
  let out='';
  for(let i=0;i<len;i++){
    out+=chars[Math.floor(Math.random()*chars.length)];
  }
  return out;
}

function loadAgentSession(){
  let data=null;
  try{
    data=JSON.parse(localStorage.getItem(SESSION_STORAGE_KEY)||'null');
  }catch(e){}

  if(!data || !data.agentId || !data.passkey){
    data={
      agentId:'NSP-'+randomHex(2)+'-'+randomHex(2),
      passkey:'CATN-'+randomHex(4)+'-'+randomHex(2),
      createdAt:new Date().toISOString(),
      visits:0,
      commands:0,
      contamination:0,
      lastSeen:null
    };
  }

  data.visits=(data.visits||0)+1;
  data.lastSeen=new Date().toISOString();
  saveAgentSession(data);
  return data;
}

function saveAgentSession(data){
  try{
    localStorage.setItem(SESSION_STORAGE_KEY,JSON.stringify(data));
  }catch(e){}
}

const AGENT_SESSION=loadAgentSession();

/* ========================================================= */
/* SYSTEM */
/* ========================================================= */

const SYSTEM = {

  clearance : 1,
  user      : 'agente_nsp',
  agentId   : AGENT_SESSION.agentId,
  passkey   : AGENT_SESSION.passkey,
  connected : true,
  axioma    : false,
  axiomaTamper : false,
  axiomaSession : null,
  contamination : AGENT_SESSION.contamination||0,
  loggedIn  : true,
  lockdownUntil : 0,
  failedAccess : 0,
  commands  : AGENT_SESSION.commands||0,
  listening : false,
  lastTrace : 'NO TRACE',
  fragments : {
    '001':false,
    '014':false,
    '017':false,
    '031':false,
    '055':false
  },
  heat      : 0,
  output    : [],
  page      : 0,
  mode      : 'terminal',
  mapX      : 0,
  mapY      : 0,
  mapZoom   : 1,
  mapFocus  : '',

};

/* ========================================================= */
/* ELEMENTS */
/* ========================================================= */

const viewport    = document.getElementById('viewport');
const canvas      = document.getElementById('canvas');
const atmosphere  = document.getElementById('atmosphere');
const burst       = document.getElementById('burst');
const scanBand    = document.getElementById('scan-band');
const stage       = document.getElementById('stage');
const focusBar    = document.getElementById('focus-bar');

const cmdOutput   = document.getElementById('cmd-output');

const promptLine  = document.getElementById('prompt-line');
const promptPrefix= document.getElementById('prompt-prefix');
const promptText  = document.getElementById('prompt-text');
const promptInput = document.getElementById('prompt-input');

const ghostLog    = document.getElementById('ghost-log');
const telemetry   = document.getElementById('telemetry');

/* ========================================================= */
/* SCALE */
/* ========================================================= */

function applyScale(){

  const vw=window.visualViewport
    ? window.visualViewport.width
    : window.innerWidth;

  const vh=window.visualViewport
    ? window.visualViewport.height
    : window.innerHeight;

  const baseScale=Math.min(
    vw/CW,
    vh/CH
  );

  const s=baseScale*scaleCalibration;

  viewport.style.width=(CW*s)+'px';
  viewport.style.height=(CH*s)+'px';

  canvas.style.setProperty('--scale',s);
  canvas.style.transform='scale('+s+')';
}

applyScale();

window.addEventListener('resize',applyScale);

if(window.visualViewport){
  window.visualViewport.addEventListener('resize',applyScale);
}

/* ========================================================= */
/* STAGE */
/* ========================================================= */

focusBar.style.top=FT0+'px';
focusBar.style.height=CELL+'px';

stage.style.gridTemplateColumns=
  'repeat('+COLS+','+CELL+'px)';

stage.style.gridTemplateRows=
  'repeat('+ROWS+','+CELL+'px)';

stage.style.width=GW+'px';
stage.style.height=(ROWS*CELL)+'px';

stage.style.left=SL0+'px';
stage.style.top=ST0+'px';

/* ========================================================= */
/* GRID */
/* ========================================================= */

const cells=[];

function rnd(){

  return CHARS[
    Math.floor(Math.random()*CHARS.length)
  ];
}

function cls(r,locked){

  if(r===CR){
    return locked ? 'c-target' : 'c-hot';
  }

  const d=Math.abs(r-CR);

  if(d===1) return 'c-mid';
  if(d<=3) return 'c-near';

  return 'c-dim';
}

for(let c=0;c<COLS;c++){

  cells[c]=[];

  for(let r=0;r<ROWS;r++){

    const d=document.createElement('div');

    d.className='cell c-dim';

    d.style.width=CELL+'px';
    d.style.height=CELL+'px';
    d.style.fontSize=FS+'px';

    d.style.gridColumn=(c+1);
    d.style.gridRow=(r+1);

    d.textContent=rnd();

    stage.appendChild(d);

    cells[c][r]=d;
  }
}

/* ========================================================= */
/* AUDIO */
/* ========================================================= */

let ac=null;
let masterGain=null;
let droneOsc=null;
let droneGain=null;
let tremolo=null;
let tremoloGain=null;
let atmosphereLevel=0.16;

function initAudio(){

  if(!ac){
    ac=new(window.AudioContext||window.webkitAudioContext)();

    masterGain=ac.createGain();
    masterGain.gain.setValueAtTime(0.72,ac.currentTime);
    masterGain.connect(ac.destination);

    droneOsc=ac.createOscillator();
    droneGain=ac.createGain();
    tremolo=ac.createOscillator();
    tremoloGain=ac.createGain();

    droneOsc.type='sine';
    droneOsc.frequency.setValueAtTime(34,ac.currentTime);

    tremolo.type='sine';
    tremolo.frequency.setValueAtTime(0.18,ac.currentTime);

    droneGain.gain.setValueAtTime(0.00001,ac.currentTime);
    tremoloGain.gain.setValueAtTime(0.002,ac.currentTime);

    tremolo.connect(tremoloGain);
    tremoloGain.connect(droneGain.gain);
    droneOsc.connect(droneGain);
    droneGain.connect(masterGain);

    droneOsc.start();
    tremolo.start();
  }

  if(ac.state==='suspended'){
    ac.resume();
  }

  droneGain.gain.cancelScheduledValues(ac.currentTime);
  droneGain.gain.setTargetAtTime(
    0.00001,
    ac.currentTime,
    0.5
  );
}

function stopAmbientDrone(){
  if(droneGain&&ac){
    droneGain.gain.cancelScheduledValues(ac.currentTime);
    droneGain.gain.setTargetAtTime(0.00001,ac.currentTime,0.08);
  }
}

function beep(freq,dur,vol,type){

  if(!ac || !masterGain) return;

  const o=ac.createOscillator();
  const g=ac.createGain();

  o.type=type||'sawtooth';

  o.frequency.setValueAtTime(
    freq,
    ac.currentTime
  );

  g.gain.setValueAtTime(
    vol||0.05,
    ac.currentTime
  );

  g.gain.exponentialRampToValueAtTime(
    0.0001,
    ac.currentTime+dur
  );

  o.connect(g);
  g.connect(masterGain);

  o.start();
  o.stop(ac.currentTime+dur);
}

function noiseBurst(dur,vol){

  if(!ac || !masterGain) return;

  const len=Math.floor(ac.sampleRate*dur);
  const buffer=ac.createBuffer(1,len,ac.sampleRate);
  const data=buffer.getChannelData(0);

  for(let i=0;i<len;i++){
    data[i]=(Math.random()*2-1)*(1-i/len);
  }

  const src=ac.createBufferSource();
  const filter=ac.createBiquadFilter();
  const g=ac.createGain();

  filter.type='bandpass';
  filter.frequency.setValueAtTime(
    900+Math.random()*1200,
    ac.currentTime
  );
  filter.Q.setValueAtTime(4,ac.currentTime);

  g.gain.setValueAtTime(vol||0.025,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(
    0.0001,
    ac.currentTime+dur
  );

  src.buffer=buffer;
  src.connect(filter);
  filter.connect(g);
  g.connect(masterGain);

  src.start();
}

function ambientBreath(dur,vol){

  if(!ac || !masterGain) return;

  const len=Math.floor(ac.sampleRate*dur);
  const buffer=ac.createBuffer(1,len,ac.sampleRate);
  const data=buffer.getChannelData(0);

  for(let i=0;i<len;i++){

    const fadeIn=Math.min(1,i/(len*0.24));
    const fadeOut=Math.min(1,(len-i)/(len*0.42));
    const env=Math.min(fadeIn,fadeOut);

    data[i]=(Math.random()*2-1)*env;
  }

  const src=ac.createBufferSource();
  const low=ac.createBiquadFilter();
  const g=ac.createGain();

  low.type='lowpass';
  low.frequency.setValueAtTime(110,ac.currentTime);
  low.Q.setValueAtTime(0.7,ac.currentTime);

  g.gain.setValueAtTime(vol||0.012,ac.currentTime);

  src.buffer=buffer;
  src.connect(low);
  low.connect(g);
  g.connect(masterGain);

  src.start();
}

function sweep(from,to,dur,vol,type){

  if(!ac || !masterGain) return;

  const o=ac.createOscillator();
  const g=ac.createGain();

  o.type=type||'sine';
  o.frequency.setValueAtTime(from,ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(
    Math.max(1,to),
    ac.currentTime+dur
  );

  g.gain.setValueAtTime(vol||0.025,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(
    0.0001,
    ac.currentTime+dur
  );

  o.connect(g);
  g.connect(masterGain);

  o.start();
  o.stop(ac.currentTime+dur);
}

function sonarPulse(){

  beep(132,0.08,0.035,'sine');

  setTimeout(()=>{
    beep(264,0.06,0.024,'sine');
  },130);

  setTimeout(()=>{
    beep(396,0.05,0.018,'sine');
  },260);
}

function commandThump(){

  beep(42,0.08,0.05,'sawtooth');
  noiseBurst(0.08,0.018);
}

function deniedSound(){

  sweep(180,32,0.35,0.05,'sawtooth');
  noiseBurst(0.18,0.045);
}

/* ========================================================= */
/* STATE */
/* ========================================================= */

const state=TARGET.map((_,ci)=>({

  offset:0,
  locked:false,
  interval:null,
  ci

}));

/* ========================================================= */
/* REFRESH */
/* ========================================================= */

function refreshCol(s){

  for(let r=0;r<ROWS;r++){

    cells[s.ci][r].className=
      'cell '+cls(r,s.locked);

    if(!s.locked){
      cells[s.ci][r].textContent=rnd();
    }
  }
}

/* ========================================================= */
/* SENSORY EVENTS */
/* ========================================================= */

function updateTelemetry(msg){

  telemetry.textContent=msg;
}

function formatLocalDate(){
  try{
    return new Intl.DateTimeFormat('es-CL',{
      dateStyle:'short',
      timeStyle:'medium'
    }).format(new Date());
  }catch(e){
    return new Date().toLocaleString();
  }
}

function simulatedClimate(){
  const month=new Date().getMonth();
  const hour=new Date().getHours();
  const coastal=SYSTEM.mapZoom>=2 || SYSTEM.lastTrace.includes('VALPARAISO') || SYSTEM.lastTrace.includes('VINA');
  let base=coastal ? 16 : 20;
  if(month>=5&&month<=7) base-=5;
  if(hour<7||hour>21) base-=4;
  const temp=base+Math.floor(Math.random()*4)-1;
  const sky=coastal
    ? ['nubosidad costera','bruma baja','viento humedo','cielo parcial'][Math.floor(Math.random()*4)]
    : ['seco','despejado','polvo en suspension','viento debil'][Math.floor(Math.random()*4)];
  return { temp, sky };
}

function environmentLine(){
  const c=simulatedClimate();
  return 'FECHA: '+formatLocalDate()+' / CLIMA NSP: '+c.temp+'C, '+c.sky+' / AGENTE: '+SYSTEM.agentId;
}

function updateAmbientTelemetry(){
  const sig=Math.max(3,Math.min(99,31+SYSTEM.contamination*3+Math.floor(Math.random()*18)));
  const watch=SYSTEM.axiomaTamper?'AXIOM':SYSTEM.mode==='map'?'FIELD':'PASSIVE';
  telemetry.textContent='SIG: '+sig+'% / '+formatLocalDate()+' / WATCH: '+watch+' / '+SYSTEM.agentId;
}

function pulseAtmosphere(mode){

  atmosphere.classList.remove('bloom','warning');

  if(mode==='warning'){
    atmosphere.classList.add('warning');
  }else{
    atmosphere.classList.add('bloom');
  }

  setTimeout(()=>{
    atmosphere.classList.remove('bloom','warning');
  },900);
}

function burstGlitch(){

  burst.classList.remove('active');
  void burst.offsetWidth;
  burst.classList.add('active');

  canvas.classList.add('alert');

  setTimeout(()=>{
    canvas.classList.remove('alert');
  },460);
}

function scanSweep(){

  scanBand.classList.remove('active');
  void scanBand.offsetWidth;
  scanBand.classList.add('active');
}

function sensoryEvent(type){

  if(type==='scan'){
    scanSweep();
    pulseAtmosphere('bloom');
    ambientBreath(1.2,0.010);
    sweep(90,660,0.8,0.034,'sine');
    noiseBurst(0.22,0.022);
    updateTelemetry('SIG: 48% / TEMP: WARM / WATCH: PASSIVE');
    return;
  }

  if(type==='trace'){
    burstGlitch();
    pulseAtmosphere('warning');
    sweep(420,55,0.42,0.05,'sawtooth');
    updateTelemetry('SIG: SPLIT / TEMP: HOT / WATCH: ACTIVE');
    return;
  }

  if(type==='memory'){
    pulseAtmosphere('bloom');
    ambientBreath(1.8,0.014);
    sonarPulse();
    updateTelemetry('SIG: ECHO / TEMP: COLD / WATCH: LISTENING');
    return;
  }

  if(type==='denied'){
    burstGlitch();
    pulseAtmosphere('warning');
    deniedSound();
    updateTelemetry('SIG: LOCKED / TEMP: HOT / WATCH: AXIOM');
    return;
  }

  if(type==='listen'){
    canvas.classList.add('deep-listen');
    pulseAtmosphere('bloom');
    ambientBreath(2.8,0.018);
    sweep(34,58,1.4,0.032,'triangle');
    updateTelemetry('SIG: OPEN / TEMP: LOW / WATCH: PASSIVE');

    setTimeout(()=>{
      canvas.classList.remove('deep-listen');
    },2600);
    return;
  }

  commandThump();
}

function markFragment(id){

  if(SYSTEM.fragments[id]!==undefined){
    SYSTEM.fragments[id]=true;
  }
}

function fragmentCount(){

  return Object.values(SYSTEM.fragments).filter(Boolean).length;
}

function chunkLines(lines,size){

  const pages=[];

  for(let i=0;i<lines.length;i+=size){
    pages.push(lines.slice(i,i+size));
  }

  return pages.length ? pages : [[]];
}

function renderPagedOutput(){

  const pages=chunkLines(SYSTEM.output,20);

  SYSTEM.page=Math.max(
    0,
    Math.min(SYSTEM.page,pages.length-1)
  );

  const visible=pages[SYSTEM.page].slice();

  if(pages.length>1){
    visible.push('');
    visible.push(
      '[PAGE '+(SYSTEM.page+1)+'/'+pages.length+
      '] next / prev / top / bottom'
    );
  }

  cmdOutput.textContent=visible.join('\n');
}

function setOutput(lines,page){

  SYSTEM.output=lines
    .filter(line=>line!==undefined && line!==null)
    .map(line=>String(line));

  SYSTEM.page=page||0;

  renderPagedOutput();
}

function normalizeMapFocus(key){
  if(key==='vina del mar') return 'vina';
  return key||'';
}

function cityMapLines(key,streetLevel){
  key=normalizeMapFocus(key);
  if(!key) return streetLevel ? CENTRAL_STREET_MAP : CENTRAL_URBAN_MAP;
  const source=streetLevel ? CITY_STREET_MAPS_V2 : CITY_OVERVIEW_MAPS;
  return source[key] || source.generic;
}

function activeMapLines(){

  if(SYSTEM.mapZoom<=-1) return MAP_LINES_COUNTRY;
  if(SYSTEM.mapZoom===0) return MAP_LINES_ZONES;
  if(SYSTEM.mapZoom>=4) return cityMapLines(SYSTEM.mapFocus,true);
  if(SYSTEM.mapZoom>=3) return cityMapLines(SYSTEM.mapFocus,false);
  if(SYSTEM.mapZoom>=2) return MAP_LINES_NEAR;
  return MAP_LINES;
}

function mapWidth(){

  return Math.max(...activeMapLines().map(line=>line.length));
}

function renderChileMap(){

  const zoom=SYSTEM.mapZoom;
  const viewW=zoom>=3 ? 68 : zoom===2 ? 60 : 66;
  const viewH=zoom<=0 ? 14 : 16;
  const mapLines=activeMapLines();
  const width=mapWidth();
  const height=mapLines.length;

  SYSTEM.mapX=Math.max(
    0,
    Math.min(SYSTEM.mapX,width-viewW)
  );

  SYSTEM.mapY=Math.max(
    0,
    Math.min(SYSTEM.mapY,height-viewH)
  );

  const lines=[
    'MAPA GEOGRAFICO :: CHILE / NSP FIELD VIEW',
    'POS X:'+SYSTEM.mapX+' Y:'+SYSTEM.mapY+
      ' Z:'+zoom+'  FOCUS:'+(SYSTEM.mapFocus||'pais')+'  CMD: flechas / in out / map ciudad',
    environmentLine(),
    ''
  ];

  for(let y=SYSTEM.mapY;y<SYSTEM.mapY+viewH;y++){

    const source=(mapLines[y]||'').padEnd(width,' ');
    lines.push(source.slice(SYSTEM.mapX,SYSTEM.mapX+viewW));
  }

  lines.push('');
  lines.push('Use "schema" para mapa logico CATN. Use "map ciudad" para ficha.');

  return lines;
}

function moveMap(dx,dy){

  SYSTEM.mapX+=dx;
  SYSTEM.mapY+=dy;
  sensoryEvent('scan');

  return renderChileMap();

function zoomMap(delta){

function normalizeKey(text){

  return (text||'')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/["']/g,'')
    .replace(/[^a-z0-9]+/g,' ')
    .trim();
}

function cityRecord(args){

  const raw=normalizeKey(args.join(' '));
  const key=CITY_ALIASES[raw];

  if(!key || !CITY_RECORDS[key]){

    const cityMatch=bestMatch(raw,Object.keys(CITY_ALIASES));
    const hint=cityMatch.value && cityMatch.score>=0.52
      ? CITY_ALIASES[cityMatch.value]
      : '';

    const lines=[
      'MAP CITY INDEX',
      '',
      'Uso:',
      'map arica',
      'map atacama',
      'map valparaiso',
      'map vina del mar',
      'map punta arenas',
      '',
      'Comando:',
      'cities'
    ];

    if(hint){
      lines.push('');
      lines.push('QUIZAS QUISO DECIR:');
      lines.push('map '+hint);
    }

    return lines;
  }

  const c=CITY_RECORDS[key];
  SYSTEM.mapFocus=key;
  SYSTEM.mapZoom=Math.max(SYSTEM.mapZoom,3);
  SYSTEM.mapX=0;
  SYSTEM.mapY=0;

  return [
    'MAP RECORD :: '+c.title,
    '',
    'ZONA       :: '+c.zone,
    'PERFIL     :: '+c.profile,
    'LECTURA    :: '+c.signal,
    '',
    c.cobra
      ? 'SE REGISTRA ACTIVIDAD DE COBRA - SIN FECHA CONTABLE'
      : 'SIN REGISTRO DE ACTIVIDAD DE COBRA'
    ,
    '',
    'Use "in" para nivel calle. Use "out" para vista regional.'
  ];
}

function axiomaKeyword(text, words){
  text=normalizeKey(text||'');
  return words.some(w=>text.includes(w));
}

function axiomaSector(data){
  const t=normalizeKey(Object.values(data).join(' '));
  if(axiomaKeyword(t,['vivienda','barrio','campamento','inmobiliaria','suelo'])) return 'territorio / vivienda';
  if(axiomaKeyword(t,['salud','hospital','sanitario','clinica','enfermedad'])) return 'salud publica';
  if(axiomaKeyword(t,['educacion','colegio','liceo','universidad','estudiante'])) return 'educacion';
  if(axiomaKeyword(t,['seguridad','delito','policia','crimen','violencia'])) return 'seguridad urbana';
  if(axiomaKeyword(t,['empleo','trabajo','empresa','desempleo','sindicato'])) return 'economia laboral';
  if(axiomaKeyword(t,['transporte','metro','bus','carretera','puerto'])) return 'movilidad / logistica';
  return 'administracion general';
}

function axiomaRisk(data){
  const t=normalizeKey(Object.values(data).join(' '));
  let score=0;
  if(axiomaKeyword(t,['protesta','escandalo','ilegal','muerte','dano','violencia'])) score+=2;
  if(axiomaKeyword(t,['alta','urgente','crisis','colapso','emergencia'])) score+=2;
  if(axiomaKeyword(t,['baja','gradual','piloto','temporal'])) score-=1;
  if(score>=3) return 'ALTO';
  if(score>=1) return 'MEDIO';
  return 'BAJO';
}

function startAxiomaSession(seed){
  const data={};
  let step=0;

  if(seed && seed.trim()){
    data.problema=seed.trim();
    step=1;
  }

  SYSTEM.axiomaSession={ step, data };
  pulseAtmosphere('warning');
  sensoryEvent('denied');

  const field=AXIOMA_FIELDS[step];
  return [
'AXIOMA :: ENTREVISTA OPERACIONAL',
'',
'Modo interactivo iniciado.',
'Escriba "cancelar" para abortar.',
'',
seed && seed.trim() ? 'PROBLEMA REGISTRADO :: '+seed.trim() : 'Entrada requerida.',
'',
'['+(step+1)+'/'+AXIOMA_FIELDS.length+'] '+field.label,
field.ask
  ].filter(Boolean);
}

function continueAxiomaSession(input){
  const session=SYSTEM.axiomaSession;
  const raw=(input||'').trim();
  const low=normalizeKey(raw);

  if(!raw){
    const field=AXIOMA_FIELDS[session.step];
    return ['AXIOMA :: DATO VACIO','','['+(session.step+1)+'/'+AXIOMA_FIELDS.length+'] '+field.label,field.ask];
  }

  if(['cancelar','cancel','salir','exit'].includes(low)){
    SYSTEM.axiomaSession=null;
    pulseAtmosphere('warning');
    return ['AXIOMA :: SIMULACION ABORTADA','','No se genero propuesta operacional.'];
  }

  const field=AXIOMA_FIELDS[session.step];
  session.data[field.key]=raw;
  session.step++;
  increaseContamination('axioma');

  if(session.step>=AXIOMA_FIELDS.length){
    const data=session.data;
    SYSTEM.axiomaSession=null;
    return axiomaPlan(data);
  }

  const next=AXIOMA_FIELDS[session.step];
  commandThump();
  return [
'DATO REGISTRADO :: '+field.label,
'',
'['+(session.step+1)+'/'+AXIOMA_FIELDS.length+'] '+next.label,
next.ask
  ];
}

      ];

    if(value==='reset'){
      scaleCalibration=DEFAULT_SCALE_CALIBRATION;
    }else{
      const next=parseFloat(value);

      if(!Number.isFinite(next) || next<0.75 || next>1.45){
        return [
          'DISPLAY SCALE :: VALUE REJECTED',
          '',
          'Use un valor entre 0.75 y 1.45',
          'Ejemplo: scale 1.10'
        ];
      }

      scaleCalibration=next;
    }

    localStorage.setItem(
      SCALE_STORAGE_KEY,
      String(scaleCalibration)
    );

    applyScale();

    return [
      'DISPLAY SCALE UPDATED',
      '',
      'CURRENT :: '+scaleCalibration.toFixed(2),
      '',
      'Si se ve demasiado grande:',
      'scale 1.05',

/* ========================================================= */
/* INTENT SUGGESTIONS */
/* ========================================================= */

function editDistance(a,b){

  a=normalizeKey(a);
  b=normalizeKey(b);

  const dp=[];

  for(let i=0;i<=a.length;i++){
    dp[i]=[i];
  }

  for(let j=1;j<=b.length;j++){
    dp[0][j]=j;
  }

  for(let i=1;i<=a.length;i++){

    for(let j=1;j<=b.length;j++){

      const cost=a[i-1]===b[j-1] ? 0 : 1;

      dp[i][j]=Math.min(
        dp[i-1][j]+1,
        dp[i][j-1]+1,
        dp[i-1][j-1]+cost
      );
    }
  }

  return dp[a.length][b.length];
}

function similarity(a,b){

  a=normalizeKey(a);
  b=normalizeKey(b);

  if(!a || !b) return 0;
  if(a===b) return 1;

  const maxLen=Math.max(a.length,b.length);
  const dist=editDistance(a,b);
  let score=1-(dist/maxLen);

  if(a.includes(b) || b.includes(a)){
    score+=0.18;
  }

  const aw=a.split(' ');
  const bw=b.split(' ');
  const shared=aw.filter(word=>bw.includes(word)).length;

  score+=shared*0.12;

  return Math.min(1,score);
}

function commandCandidates(){

  return [
    ...Object.keys(COMMANDS),
    ...Object.keys(ALIASES)
  ];
}

function bestMatch(query,candidates){

  let best=null;
  let bestScore=0;

  for(const candidate of candidates){

    const score=similarity(query,candidate);

    if(score>bestScore){
      best=candidate;
      bestScore=score;
    }
  }

  return {
    value:best,
    score:bestScore
  };
}

function suggestCommand(base,args,raw){

  const full=normalizeKey(raw);
  const cmdMatch=bestMatch(base,commandCandidates());
  const cityMatch=bestMatch(
    args.join(' ') || base,
    Object.keys(CITY_ALIASES)
  );

  const suggestions=[];

  if(cmdMatch.value && cmdMatch.score>=0.58){

    const resolved=ALIASES[cmdMatch.value]||cmdMatch.value;
    suggestions.push(resolved);
  }

  if(cityMatch.value && cityMatch.score>=0.58){

    suggestions.push('map '+CITY_ALIASES[cityMatch.value]);
  }

  if(full.includes('cobra')){
    suggestions.push('trace');
    suggestions.push('cobra');
  }

  if(full.includes('neural') || full.includes('axiom')){
    suggestions.push('neuralypsis');
    suggestions.push('axioma');
  }

  return [...new Set(suggestions)].slice(0,3);
}

  AGENT_SESSION.commands=SYSTEM.commands;
  AGENT_SESSION.contamination=SYSTEM.contamination;
  AGENT_SESSION.lastSeen=new Date().toISOString();
  saveAgentSession(AGENT_SESSION);

function increaseContamination(base){
  const heavy=['axioma','read','trace','signal','whoiscobra','panic'];
  const delta=heavy.includes(base)
    ? 1.8+Math.random()*1.2
    : 0.35+Math.random()*0.45;
  SYSTEM.contamination=Math.min(100,SYSTEM.contamination+delta);
  persistSession();
}

function contaminateLines(base,lines){
  if(!Array.isArray(lines)) return lines;
  if(SYSTEM.contamination<8 && !SYSTEM.axiomaTamper) return lines;

  const out=lines.slice();
  const chance=Math.min(0.62,0.08+SYSTEM.contamination/140+(SYSTEM.axiomaTamper?0.16:0));

  if(Math.random()<chance){
    const inserts=[
      '[REVISION NSP: campo inconsistente, no descartar error humano]',
      '[NEURALEON MIRROR: copia parcial creada antes de esta lectura]',
      '[AXIOMA: prioridad de archivo modificada por eficiencia]',
      '[NOTA LOCAL '+SYSTEM.agentId+': patron de consulta incorporado]',
      '[CHECKSUM: VALIDO / CHECKSUM: VALIDO / CHECKSUM: FALLA]',
      '[DATO CONTRADICTORIO: existe otra version del mismo evento]'
    ];
    out.push('');
    out.push(inserts[Math.floor(Math.random()*inserts.length)]);
  }

  if(SYSTEM.contamination>28 && Math.random()<0.28){
    const idx=out.findIndex(l=>typeof l==='string' && l.length>14 && !l.startsWith('['));
    if(idx>-1){
      out[idx]=out[idx].replace(/[aeiou]/gi,m=>Math.random()>0.72?'X':m);
    }
  }

  return out;
}

/* COMMAND RUNNER */
/* ========================================================= */

function runCommand(cmd){

  const rawCmd=cmd.trim();

  if(SYSTEM.axiomaSession){
    return continueAxiomaSession(rawCmd);
  }

  cmd=rawCmd.toLowerCase();

  const parts=cmd.split(/\s+/).filter(Boolean);
  let base=parts[0]||'';
  const args=parts.slice(1);

  if(ALIASES[base]){
    base=ALIASES[base];
  }

  if(base===''){
    return { action:'page', delta:0 };
  }

  if(!SYSTEM.loggedIn && !['login','session','help'].includes(base)){
    return [
      'SESION CERRADA',
      '',
      'Comando bloqueado: '+base,
      'Use login '+SYSTEM.passkey
    ];
  }

  if(Date.now()<SYSTEM.lockdownUntil && !['status','session','env','purge','help'].includes(base)){
    return [
      'PROTOCOLO ROJO :: CUARENTENA ACTIVA',
      '',
      'Comando bloqueado: '+base,
      'Permitidos: status / session / env / purge / help',
      'Tiempo restante: '+Math.ceil((SYSTEM.lockdownUntil-Date.now())/1000)+'s'
    ];
  }

  if(base!==''){
    SYSTEM.commands++;
    increaseContamination(base);
  }

  const fn=COMMANDS[base] || HIDDEN_COMMANDS[base];

  if(!fn){

    const suggestions=suggestCommand(base,args,cmd);
    const lines=[

'COMMAND NOT RECOGNIZED',
'',
'TYPE "help"',
'OR TRY "scan"'

    ];

    if(suggestions.length){

      lines.push('');
      lines.push('NSP INTENT RESOLVER:');

      for(const suggestion of suggestions){
        lines.push('quizas quiso decir: '+suggestion);
      }
    }

    return lines;
  }

  sensoryEvent('command');

  let _result = fn(args,cmd);
  _result = contaminateLines(base,_result);

  /* Voz: leer output real del comando */
  if(VOICE_MAP[base] && ac && window.speechSynthesis){
    const _lines = Array.isArray(_result) ? _result : [];
    const _readable = _lines
      .filter(l=>typeof l==='string'&&l.trim().length>0)
      .filter(l=>/[a-zA-ZáéíóúñÁÉÍÓÚÑ]/.test(l))
      .join('. ')
      .replace(/::/g,',').replace(/[|\\/#@~^*+%&!?<>{}\[\]]/g,' ')
      .replace(/\s{2,}/g,' ').trim();
    if(_readable.length>0) VOICE.speak(_readable, VOICE_MAP[base]);
  }

  return _result;
}

async function typeLine(text){

  for(let i=0;i<text.length;i++){

    let char=text[i];

    if(Math.random()>0.988){

      cmdOutput.textContent+='#';

      await wait(8);

      cmdOutput.textContent=
        cmdOutput.textContent.slice(0,-1);
    }

    cmdOutput.textContent+=char;

    if(char!==' '){

      const sharp='[]:/\\"|_'.includes(char);

      beep(
        sharp
          ? 80+Math.random()*60
          : 40+Math.random()*25,
        sharp ? 0.018 : 0.012,
        sharp ? 0.012 : 0.008,
        sharp ? 'triangle' : 'square'
      );

      if(Math.random()>0.992){
        noiseBurst(0.035,0.008);
      }
    }

    await wait(
      char===' '
        ? 5
        : 14+Math.random()*14
    );
  }

  cmdOutput.textContent+='\n';
}

async function printOutput(lines){

  if(lines && lines.action==='page'){

    const pages=chunkLines(SYSTEM.output,20);

    if(lines.to==='top'){
      SYSTEM.page=0;
    }else if(lines.to==='bottom'){
      SYSTEM.page=pages.length-1;
    }else{
      SYSTEM.page+=lines.delta||0;
    }

    renderPagedOutput();
    return;
  }

  if(lines==='__CLEAR__' || (Array.isArray(lines) && lines[0]==='__CLEAR__')){

    cmdOutput.textContent='';
    SYSTEM.output=[];
    SYSTEM.page=0;

    return;
  }

  cmdOutput.textContent='';

  const outputLines=lines.filter(
    line=>line!==undefined && line!==null
  );

  SYSTEM.output=outputLines.map(line=>String(line));
  SYSTEM.page=0;

  if(outputLines.length>20){
    renderPagedOutput();
    return;
  }

  for(const line of outputLines){

    await typeLine(String(line));

    await wait(40);
  }

  SYSTEM.output=outputLines.map(line=>String(line));
}

    ArrowDown:[0,4],
    ArrowLeft:[-8,0],

  };

  if(SYSTEM.mode==='map' && arrowMove[e.key] && !printing){
    e.preventDefault();
    const [dx,dy]=arrowMove[e.key];
    printing=true;
    promptInput.value='';
    promptText.textContent='';
    try{
      await printOutput(moveMap(dx,dy));
    }finally{
      printing=false;
      promptInput.focus();
    }
    return;

  beep(
    55+Math.random()*30,
    0.04,
    0.03,
    'sawtooth'
  );

  if(e.key==='Enter'){

    e.preventDefault();

    if(printing) return;

    const cmd=promptInput.value;

    promptInput.value='';
    promptText.textContent='';

    try{

      printing=true;

      const result=runCommand(cmd);

      await printOutput(result);

    }catch(err){

      setOutput([
        'TERMINAL ERROR',
        '',
        'El subsistema de comandos se recupero.',
        'Puede seguir escribiendo.'
      ]);

    }finally{

      printing=false;
      promptInput.focus();
    }
  }
});

function startExit(){

  const STEPS_UP=4;
  const STEPS_LEFT=6;
  const STEPS=STEPS_LEFT;

  let barTop=FT0;
  let stTop=ST0;
  let stLeft=SL0;

  let pLeft=SL0+GW+Math.round(CELL*0.35);

  let step=0;

  const tick=setInterval(()=>{

    step++;

    if(step<=STEPS_UP){

      barTop-=CELL;

      focusBar.style.top=barTop+'px';

      stTop-=CELL;

      stage.style.top=stTop+'px';

      promptLine.style.top=
        (barTop+CELL/2)+'px';
    }

    stLeft-=CELL;

    stage.style.left=stLeft+'px';

    pLeft-=CELL;

    promptLine.style.left=pLeft+'px';

    beep(
      Math.max(28,70-step*4),
      0.08,
      0.04,
      'sawtooth'
    );

    if(step>=STEPS){

      clearInterval(tick);

      const outTop=barTop+CELL+20;

      cmdOutput.style.top=outTop+'px';
      cmdOutput.style.left=pLeft+'px';

      cmdOutput.style.display='block';

      promptInput.focus();
    }

  },120);
}

  s.locked=true;

  clearInterval(s.interval);

  for(let r=0;r<ROWS;r++){

    cells[s.ci][r].className=
      'cell '+cls(r,true);

    cells[s.ci][r].textContent=
      (r===CR)
        ? TARGET[s.ci]
        : rnd();
  }

  beep(
    55+s.ci*10,
    0.5,
    0.06,
    'sawtooth'
  );

  if(++locked===COLS){

    setTimeout(()=>{

      beep(55,0.6,0.08,'sawtooth');

      setTimeout(()=>{
        beep(82,0.5,0.07,'sawtooth');
      },200);

      setTimeout(()=>{
        beep(110,0.7,0.06,'sawtooth');
      },400);

      setTimeout(showPrompt,900);

    },300);
  }
}

function runCol(s){

  let t=0;

  const stop=
    60+s.ci*30+
    Math.floor(Math.random()*20);

  s.interval=setInterval(()=>{

    t++;

    s.offset=(s.offset+1)%ROWS;

    refreshCol(s);

    if(Math.random()>0.80){

      beep(
        30+Math.random()*40,
        0.03,
        0.01,
        'square'
      );
    }

    if(t>=stop){
      lockCol(s);
    }

  },48+s.ci*15);
}

/* ========================================================= */
/* TEXT CORRUPTION                                           */
/* ========================================================= */

const CORRUPT_CHARS='XXXXX░█▄▀■□◆◇'.split('');

function corruptText(el,intensity){
  intensity=intensity||0.04;
  const orig=el.textContent; if(!orig) return;
  const corrupted=orig.split('').map(ch=>{
    if(ch==='\n'||ch===' ') return ch;
    return Math.random()<intensity ? CORRUPT_CHARS[Math.floor(Math.random()*CORRUPT_CHARS.length)] : ch;
  }).join('');
  el.textContent=corrupted;
  setTimeout(()=>{ el.textContent=orig; },60+Math.random()*80);
}

const VOICE = {

  cancel(){ if(window.speechSynthesis) window.speechSynthesis.cancel(); },

  speak(text, profile){
    if(!window.speechSynthesis) return;
    this.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    const voices = window.speechSynthesis.getVoices();
    const preferred = voices.find(v=>v.lang.startsWith('es')&&v.name.toLowerCase().includes('male'))
                   || voices.find(v=>v.lang.startsWith('es'))
                   || voices[0];
    if(preferred) utter.voice = preferred;

    if(profile==='cobra'){
      utter.rate=0.72; utter.pitch=0.45; utter.volume=0.88;
      utter.onstart=()=>{
        noiseBurst(0.18,0.022); sweep(320,38,0.6,0.028,'sawtooth');
        this._int=setInterval(()=>{
          if(Math.random()>0.6) noiseBurst(0.06+Math.random()*0.08,0.008+Math.random()*0.015);
          if(Math.random()>0.82) beep(28+Math.random()*30,0.05,0.018,'sawtooth');
        },380);
      };
      utter.onend=()=>{ clearInterval(this._int); };

    } else if(profile==='axioma'){
      utter.rate=0.58; utter.pitch=0.22; utter.volume=0.92;
      utter.onstart=()=>{
        burstGlitch(); sweep(260,28,1.1,0.038,'sawtooth');

          if(Math.random()>0.5) beep(22+Math.random()*20,0.08,0.022,'sawtooth');

      };
      utter.onend=()=>{ clearInterval(this._int); beep(18,0.4,0.028,'sine'); };

    } else {
      /* system — voz fria institucional */
      utter.rate=0.82; utter.pitch=0.62; utter.volume=0.80;
    }

    if(window.speechSynthesis.getVoices().length===0){
      window.speechSynthesis.addEventListener('voiceschanged',()=>{
        window.speechSynthesis.speak(utter);
      },{once:true});
    } else {
      window.speechSynthesis.speak(utter);
    }
  }
};
