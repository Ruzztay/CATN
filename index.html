<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CATN - Neuralypsis Interface</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body, html {
            background-color: #000;
            color: #00ff41;
            font-family: 'VT323', monospace;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #focus-bar {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 160px;
            background: rgba(0, 255, 65, 0.05);
            border-top: 2px solid rgba(0, 255, 65, 0.2);
            border-bottom: 2px solid rgba(0, 255, 65, 0.2);
            transform: translateY(-50%);
            z-index: 1;
        }

        #scanner-container {
            display: flex;
            align-items: center;
            z-index: 2;
            height: 100vh;
        }

        .column {
            width: 100px;
            text-align: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .letter-strip {
            display: flex;
            flex-direction: column;
            font-size: 9rem;
            will-change: transform;
        }

        .letter-strip div {
            height: 160px; 
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        #cursor {
            font-size: 9rem;
            background-color: #00ff41;
            width: 50px;
            height: 110px;
            margin-left: 20px;
            opacity: 0;
        }

        .blink { animation: blink-anim 1s step-end infinite; }
        @keyframes blink-anim { from, to { opacity: 1; } 50% { opacity: 0; } }

        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, 
                black 0%, 
                transparent 30%, 
                transparent 70%, 
                black 100%);
            z-index: 3;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="vignette"></div>
    <div id="focus-bar"></div>

    <div id="scanner-container">
        <div class="column"><div id="col-0" class="letter-strip"></div></div>
        <div class="column"><div id="col-1" class="letter-strip"></div></div>
        <div class="column"><div id="col-2" class="letter-strip"></div></div>
        <div class="column"><div id="col-3" class="letter-strip"></div></div>
        <div id="cursor">_</div>
    </div>

    <script>
        const target = "CATN";
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$@%".split("");
        const strips = [
            document.getElementById("col-0"),
            document.getElementById("col-1"),
            document.getElementById("col-2"),
            document.getElementById("col-3")
        ];

        const rowHeight = 160;
        const stopIndex = 15; // La posición donde pondremos la letra correcta

        strips.forEach((strip, i) => {
            let content = "";
            
            // Creamos la tira de letras
            for(let j = 0; j < 80; j++) {
                // Si llegamos a la posición de parada, ponemos la letra de CATN
                if (j === stopIndex) {
                    content += `<div>${target[i]}</div>`;
                } else {
                    content += `<div>${chars[Math.floor(Math.random() * chars.length)]}</div>`;
                }
            }
            
            strip.innerHTML = content;

            // Empezamos desde abajo
            const startPos = -((80 - 1) * rowHeight);
            strip.style.transform = `translateY(${startPos}px)`;
        });

        window.onload = () => {
            setTimeout(() => {
                strips.forEach((strip, i) => {
                    const duration = 2500 + (i * 800);
                    // Frenamos exactamente en el stopIndex (donde pusimos la letra real)
                    const finalPos = -(stopIndex * rowHeight);

                    strip.style.transition = `transform ${duration}ms cubic-bezier(0.1, 0, 0.1, 1)`;
                    strip.style.transform = `translateY(${finalPos}px)`;

                    if(i === 3) {
                        setTimeout(() => {
                            document.getElementById("cursor").classList.add("blink");
                        }, duration + 500);
                    }
                });
            }, 200);
        };
    </script>
</body>
</html>
