<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CATN - Neuralypsis Interface</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body, html {
            background-color: #000;
            color: #00ff41;
            font-family: 'VT323', monospace;
            margin: 0; padding: 0;
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        /* OPCIÓN 2: Scanlines (Líneas de monitor antiguo) */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        #focus-bar {
            position: absolute;
            top: 50%; left: 0;
            width: 100%; height: 160px;
            background: rgba(0, 255, 65, 0.05);
            border-top: 2px solid rgba(0, 255, 65, 0.2);
            border-bottom: 2px solid rgba(0, 255, 65, 0.2);
            transform: translateY(-50%);
            z-index: 1;
        }

        #scanner-container {
            display: flex; align-items: center;
            z-index: 2; height: 160px;
        }

        .column {
            width: 100px; text-align: center;
            height: 160px; overflow: visible;
            display: flex; flex-direction: column;
        }

        .letter-strip {
            display: flex; flex-direction: column;
            font-size: 9rem;
        }

        .letter-strip div {
            height: 160px;
            display: flex; justify-content: center; align-items: center;
            flex-shrink: 0;
        }

        /* OPCIÓN 1: Glitch (Inestabilidad de señal) */
        .glitch {
            animation: glitch-anim 0.2s infinite;
        }
        @keyframes glitch-anim {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); opacity: 0.8; }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        #cursor {
            font-size: 9rem;
            background-color: #00ff41;
            width: 50px; height: 110px;
            margin-left: 20px;
            display: none;
        }

        .blink { animation: blink-anim 1s step-end infinite; }
        @keyframes blink-anim { from, to { opacity: 1; } 50% { opacity: 0; } }

        #vignette {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, black 120%);
            z-index: 5; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="vignette"></div>
    <div id="focus-bar"></div>

    <div id="scanner-container">
        <div class="column"><div id="col-0" class="letter-strip"></div></div>
        <div class="column"><div id="col-1" class="letter-strip"></div></div>
        <div class="column"><div id="col-2" class="letter-strip"></div></div>
        <div class="column"><div id="col-3" class="letter-strip"></div></div>
        <div id="cursor">_</div>
    </div>

    <!-- Sonidos generados mediante síntesis web para no depender de archivos externos -->
    <script>
        const target = "CATN";
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$@%&?".split("");
        const strips = [
            document.getElementById("col-0"),
            document.getElementById("col-1"),
            document.getElementById("col-2"),
            document.getElementById("col-3")
        ];

        const rowHeight = 160;
        const targetIndex = 5;

        // Audio Context para el Sonido (OPCIÓN 3)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playBeep(freq, dur) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + dur);
        }

        strips.forEach((strip, i) => {
            let content = "";
            for (let j = 0; j < 40; j++) {
                content += `<div>${j === targetIndex ? target[i] : chars[Math.floor(Math.random() * chars.length)]}</div>`;
            }
            strip.innerHTML = content;
            strip.style.transform = `translateY(-${(30 * rowHeight)}px)`;
        });

        // Iniciar con un clic (requerido por navegadores para el audio)
        document.body.addEventListener('click', initTerminal, { once: true });

        function initTerminal() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            strips.forEach((strip, i) => {
                const duration = 2500 + (i * 1000);
                strip.style.transition = `transform ${duration}ms cubic-bezier(0.15, 0, 0.05, 1)`;
                strip.style.transform = `translateY(-${(targetIndex * rowHeight)}px)`;

                // Efecto de Glitch aleatorio durante el giro
                const glitchInterval = setInterval(() => {
                    strip.classList.toggle('glitch');
                }, Math.random() * 500 + 200);

                setTimeout(() => {
                    clearInterval(glitchInterval);
                    strip.classList.remove('glitch');
                    playBeep(150, 0.1); // Sonido de "bloqueo"
                }, duration);

                if(i === 3) {
                    setTimeout(() => {
                        const cursor = document.getElementById("cursor");
                        cursor.style.display = "block";
                        cursor.classList.add("blink");
                        playBeep(400, 0.3);
                    }, duration + 300);
                }
            });
        }

        // Mostrar aviso visual para el primer clic
        console.log("Haz clic en la pantalla para iniciar la secuencia de audio.");
    </script>
</body>
</html>
