<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CATN - Terminal Interface</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width:100vw; height:100vh; background:#000; overflow:hidden; font-family:'Courier New',monospace; }
    body::before {
      content:''; position:fixed; inset:0; pointer-events:none; z-index:100;
      background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.15) 2px,rgba(0,0,0,0.15) 4px);
    }
    body::after {
      content:''; position:fixed; inset:0; pointer-events:none; z-index:99;
      background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,0.88) 100%);
    }
    #scaler { position:fixed; inset:0; overflow:hidden; display:flex; align-items:center; justify-content:center; z-index:1; }
    #canvas { position:relative; width:2560px; height:1440px; flex-shrink:0; transform-origin:center center; overflow:hidden; }
    #stage  { position:absolute; display:grid; }
    .cell   { display:flex; align-items:center; justify-content:center; font-weight:700; user-select:none; }
    .c-dim    { color:rgba(0,255,65,0.12); }
    .c-near   { color:rgba(0,255,65,0.32); }
    .c-mid    { color:rgba(0,255,65,0.60); }
    .c-hot    { color:#00ff41; text-shadow:0 0 8px rgba(0,255,65,0.6); }
    .c-target { color:#00ff41; text-shadow:0 0 20px #00ff41,0 0 6px #fff; }
    #focus-bar {
      position:absolute; left:0; width:100%; pointer-events:none; z-index:2;
      background:rgba(0,255,65,0.06);
      border-top:1px solid rgba(0,255,65,0.30); border-bottom:1px solid rgba(0,255,65,0.30);
    }
    #boot-msg {
      position:absolute; bottom:60px; width:100%; text-align:center;
      color:rgba(0,255,65,0.65); font-size:28px; letter-spacing:0.22em; z-index:200;
      animation:blink 1.3s step-end infinite;
    }
    #prompt-line {
      position:absolute; display:none; align-items:center; z-index:200;
      font-size:100px; color:rgba(0,255,65,0.85); white-space:nowrap;
      max-width:2400px; overflow:hidden;
    }
    #prompt-prefix { color:rgba(0,255,65,0.55); margin-right:0.2em; flex-shrink:0; }
    #prompt-text   {
      color:rgba(0,255,65,0.85); font-family:'Courier New',monospace;
      font-size:inherit; letter-spacing:0.05em;
      overflow:hidden; white-space:nowrap;
      direction:ltr; text-align:left;
      min-width:0;
    }
    #prompt-input {
      position:absolute; opacity:0; pointer-events:none;
      width:1px; height:1px; left:-9999px;
    }
    #prompt-cursor {
      display:inline-block; width:0.55em; height:0.82em; background:#00ff41;
      margin-left:2px; vertical-align:middle; animation:blink 1s step-end infinite;
      flex-shrink:0;
    }
    #cmd-output {
      position:absolute; z-index:200; display:none;
      font-size:52px; color:rgba(0,255,65,0.75);
      font-family:'Courier New',monospace; letter-spacing:0.04em;
      line-height:1.55; white-space:pre;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  </style>
</head>
<body>
<div id="scaler">
  <div id="canvas">
    <div id="focus-bar"></div>
    <div id="stage"></div>
    <div id="boot-msg">[ HAGA CLIC PARA INICIAR SECUENCIA ]</div>
    <div id="prompt-line">
      <span id="prompt-prefix">:\&gt;&nbsp;</span>
      <span id="prompt-text"></span>
      <span id="prompt-cursor"></span>
    </div>
    <input id="prompt-input" type="text" autocomplete="off" spellcheck="false"/>
    <div id="cmd-output"></div>
  </div>
</div>

<script>
(function(){
  const CW=2560, CH=1440, CELL=160, FS=100, COLS=4;
  const TARGET=['C','A','T','N'];
  const CHARS='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&!?'.split('');

  const canvas=document.getElementById('canvas');
  function applyScale(){ const s=Math.min(window.innerWidth/CW,window.innerHeight/CH); canvas.style.transform='scale('+s+')'; }
  applyScale(); window.addEventListener('resize',applyScale);

  const CR=4, ROWS=18, GW=COLS*CELL;
  const SL0=(CW-GW)/2, ST0=0, FT0=CR*CELL;

  const focusBar=document.getElementById('focus-bar');
  focusBar.style.top=FT0+'px'; focusBar.style.height=CELL+'px';

  const stage=document.getElementById('stage');
  stage.style.gridTemplateColumns='repeat('+COLS+','+CELL+'px)';
  stage.style.gridTemplateRows   ='repeat('+ROWS+','+CELL+'px)';
  stage.style.width=GW+'px'; stage.style.height=(ROWS*CELL)+'px';
  stage.style.left=SL0+'px'; stage.style.top=ST0+'px';

  const cells=[];
  for(let c=0;c<COLS;c++){
    cells[c]=[];
    for(let r=0;r<ROWS;r++){
      const d=document.createElement('div');
      d.className='cell c-dim';
      d.style.width=CELL+'px'; d.style.height=CELL+'px'; d.style.fontSize=FS+'px';
      d.style.gridColumn=(c+1)+''; d.style.gridRow=(r+1)+'';
      d.textContent=rnd(); stage.appendChild(d); cells[c][r]=d;
    }
  }
  function rnd(){ return CHARS[Math.floor(Math.random()*CHARS.length)]; }
  function cls(r,locked){
    if(r===CR) return locked?'c-target':'c-hot';
    const d=Math.abs(r-CR); if(d===1) return 'c-mid'; if(d<=3) return 'c-near'; return 'c-dim';
  }

  const state=TARGET.map((_,ci)=>({offset:0,locked:false,interval:null,ci}));
  function refreshCol(s){
    for(let r=0;r<ROWS;r++){
      cells[s.ci][r].className='cell '+cls(r,s.locked);
      if(!s.locked) cells[s.ci][r].textContent=rnd();
    }
  }

  let ac=null;
  function initAudio(){ if(!ac) ac=new(window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }
  function beep(freq,dur,vol,type){
    if(!ac) return; vol=vol||0.05; type=type||'sawtooth';
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,ac.currentTime);
    g.gain.setValueAtTime(vol,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+dur);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+dur);
  }

  /* ── COMANDOS ACTUALIZADOS ── */
  const COMMANDS = {
    help: () => [
      '┌────────────────── :: CATN HELP :: ──────────────────┐',
      '│ help       │ Muestra esta lista de ayuda            │',
      '│ about      │ Información del proyecto CATN          │',
      '│ status     │ Estado vital del sistema y red         │',
      '│ scan       │ Escaneo de nodos de red Neuraleon      │',
      '│ logs       │ Accede a fragmentos de memoria         │',
      '│ time       │ Muestra la hora y fecha del sistema    │',
      '│ echo <txt> │ Replica el texto ingresado             │',
      '│ clear      │ Limpia la pantalla de la terminal      │',
      '│ exit       │ Termina la sesión actual               │',
      '└─────────────────────────────────────────────────────┘'
    ],
    about: () => [
      '  CATN — Cobra: Against the Neuralypsis',
      '  Proyecto de ciencia ficción bajo control tecnocrático.',
      '  [ESTADO: PROTOTIPO ACTIVO]'
    ],
    status: () => [
      '  Reactor: ESTABLE | Red Neuraleon: DETECTADA',
      '  Axioma: MONITOREANDO | Cobra: SIN SEÑAL'
    ],
    scan: () => [
      '  Escaneando red Neuraleon...',
      '  [OK] Nodo Central - 127.0.0.1',
      '  [??] Entrada Cifrada - 192.168.0.42',
      '  [!!] Intrusión detectada en subnivel 4.'
    ],
    logs: () => [
      '  [LOG_01]: Interferencia detectada en el sector 7.',
      '  [LOG_02]: Los servidores de Axioma no responden.',
      '  [LOG_03]: Confirmado: El núcleo de Cobra ha despertado.'
    ],
    time: () => [
      '  FECHA: ' + new Date().toLocaleDateString(),
      '  HORA : ' + new Date().toLocaleTimeString()
    ],
    echo: (args) => [ '  > ' + (args || 'Nada que repetir.') ],
    clear: () => '__CLEAR__',
    exit: () => [ '  TERMINANDO SESIÓN...', '  CONEXIÓN CERRADA. ADIÓS.' ],
    whoami: () => [ '  USUARIO NO IDENTIFICADO. ACCESO PROVISIONAL.' ]
  };

  const bootMsg=document.getElementById('boot-msg');
  const promptLine=document.getElementById('prompt-line');
  const promptInput=document.getElementById('prompt-input');
  const promptText=document.getElementById('prompt-text');
  const cmdOutput=document.getElementById('cmd-output');

  let active=false;
  window.addEventListener('click',()=>{
    if(active) return; active=true;
    initAudio(); bootMsg.style.display='none';
    state.forEach(s=>{
      s.interval=setInterval(()=>{ refreshCol(s); if(Math.random()<0.03) beep(200+Math.random()*400,0.05,0.02); },100);
    });
    setTimeout(()=>unlock(0),1000);
  });

  function unlock(idx){
    if(idx>=COLS){
      setTimeout(showTerminal,800);
      return;
    }
    state[idx].locked=true;
    clearInterval(state[idx].interval);
    refreshCol(state[idx]);
    beep(800,0.2,0.1,'sine');
    setTimeout(()=>unlock(idx+1),500);
  }

  function showTerminal(){
    promptLine.style.display='flex';
    promptLine.style.left=SL0+'px';
    promptLine.style.top=(FT0+CELL+40)+'px';
    cmdOutput.style.display='block';
    cmdOutput.style.left=SL0+'px';
    cmdOutput.style.top=(FT0+CELL+200)+'px';
    promptInput.focus();
  }

  window.addEventListener('keydown',()=>{ if(active) promptInput.focus(); });

  promptInput.addEventListener('input',()=>{ promptText.textContent=promptInput.value; });

  promptInput.addEventListener('keydown',(e)=>{
    if(e.key==='Enter'){
      const val=promptInput.value;
      promptInput.value=''; promptText.textContent='';
      if(val.trim()){
        beep(400,0.1,0.05);
        handleCommand(val);
      }
    }
  });

  function handleCommand(rawCmd){
    const parts = rawCmd.trim().split(' ');
    const cmdKey = parts[0].toLowerCase();
    const args = parts.slice(1).join(' ');
    
    const fn = COMMANDS[cmdKey];
    if(fn){
      const res = fn(args);
      if(res==='__CLEAR__'){
        cmdOutput.textContent='';
      } else {
        cmdOutput.textContent = res.join('\n') + '\n\n' + cmdOutput.textContent;
      }
    } else {
